# Daily competitive-intelligence ingestion.
# Requires repository secret GEMINI_API_KEY (Settings → Secrets → Actions).

name: Daily CI Intel Ingest

on:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.pipeline.run_daily --trigger cron

      - name: Upload SQLite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-intel-db-${{ github.run_id }}
          path: data/ci_intel.db
          if-no-files-found: warn
          retention-days: 14
