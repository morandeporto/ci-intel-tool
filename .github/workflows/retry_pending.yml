# Nightly rescore-only pass for pending_scoring / is_fallback items (no feed fetch).
#
# Quota reset timing (do NOT hardcode into application logic):
#   Observed Gemini free-tier error hint example (2026-10): "Please retry in 3h42m12s"
#   / RetryInfo delay. Soft llm_usage day boundary is UTC (quota_day_timezone).
#   Free-tier PerDay caps often roll near US Pacific midnight (~07:00-08:00 UTC).
#   Cron below is 08:30 UTC - after a typical reset window, with a safety margin,
#   and AFTER the daily ingest at 06:00 UTC so primary quota is not fought mid-day.
#
# Requires repository secrets (same as daily ingest):
#   GEMINI_API_KEY, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN

name: Retry Pending Scoring

on:
  schedule:
    # 08:30 UTC daily - see header comment for quota-reset rationale.
    - cron: "30 8 * * *"
  workflow_dispatch:

concurrency:
  # Never overlap with daily ingest / another retry (atomic DB claims are a second line).
  group: ci-intel-pipeline
  cancel-in-progress: false

jobs:
  retry-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Turso secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ], then
            echo "TURSO_DATABASE_URL and TURSO_AUTH_TOKEN must be set as repository secrets."
            exit 1
          fi

      - name: Ping Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          from src.db.connection import get_connection, init_db, turso_configured
          if not turso_configured():
              raise SystemExit("Turso is not configured (check secrets / placeholders).")
          init_db()
          conn = get_connection()
          try:
              conn.execute("SELECT 1")
              print("Turso reachable.")
          finally:
              conn.close()
          PY

      - name: Rescore pending / fallback items
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        # Python exits 0 when quota stops the pass (items stay pending for next night).
        # Hard failure (e.g. unexpected crash after Turso ping) exits non-zero.
        run: python -m src.pipeline.run_daily --rescore-fallbacks --trigger cron
