        claim: "Automatic vulnerability scanning of packages with policy gates at the registry."
        source_url: "https://cloudsmith.com/product/integrations/github-actions"
        quote: "Every package pushed to a Cloudsmith repository is automatically scanned for known vulnerabilities using continuously updated security databases."
