# Keyword relevance gate for industry/community sources (gate: strict).
# Official competitor and emerging sources use gate: off — never filtered by keywords.
# Strong keywords: at least ONE whole-word match required to pass strict gate.
# Weak keywords: never enough alone (used only for ranking signals later if needed).

strong_keywords:
  - supply chain
  - SBOM
  - CVE
  - malicious package
  - artifact repository
  - package registry
  - Artifactory
  - Xray
  - Nexus
  - Sonatype
  - Snyk
  - JFrog
  - Cloudsmith
  - npm
  - PyPI
  - Maven
  - typosquatting
  - dependency confusion
  - provenance
  - Sigstore
  - SLSA
  - MCP registry

weak_keywords:
  - container
  - Docker
  - package
  - vulnerability
  - CI/CD
  - DevSecOps
  - registry
  - security
  - GitHub
  - GitLab

# Applied to ALL sources before gate/selection (title match, case-insensitive).
exclude_title_patterns:
  - Planned Cloud Maintenance
  - Scheduled Maintenance
