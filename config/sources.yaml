# Ingestion sources. URLs verified with scripts/verify_feeds.py - do not invent mock URLs.
# kind: official_competitor | emerging | industry | community
# gate: "off" (never keyword-filtered) | "strict" (needs a strong keyword)
# Quote "off" - YAML 1.1 otherwise parses bare off as boolean false.
# competitor: entity id from competitors.yaml, or null for pure industry/community outlets.
# user_agent: honest (default) | browser (only when the honest UA is rejected)
# last_verified: YYYY-MM-DD of the last successful HTTP/feed check.

sources:
  # --- JFrog / official competitors -----------------------------------------
