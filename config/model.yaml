# LLM provider settings. Swap model_id (and API key in .env) to change providers.
# Provider/model must never be hardcoded in application logic.
# gemini-2.0-flash was retired by Google; gemini-3.8-flash is the current free-tier default.

provider: gemini
model_id: gemini-3.8-flash
max_items_per_run: 20
max_per_source: 3
# Freshness window: only consider items published within this many hours.
# Wider than 24h so date-only midnight timestamps and one missed cron day are covered.
window_hours: 48
request_timeout_seconds: 60
# Per-source HTTP timeout (seconds). One slow feed must not block the run.
fetch_timeout_seconds: 15
# Concurrent feed fetches (ThreadPoolExecutor workers).
fetch_concurrency: 8
max_excerpt_chars: 4000
rate_limit_sleep_seconds: 1.0
# LLM reliability: retry transient 503/429/timeouts (not other 4xx).
llm_max_attempts: 3
llm_retry_base_seconds: 1.0
llm_retry_max_seconds: 20.0
# Cap concurrent Gemini calls; keep burst small.
llm_concurrency: 3
# Minimum spacing between Gemini calls across workers (seconds).
llm_min_interval_seconds: 0.5
# Auto-heal fallbacks from the last N days at end of each run / --rescore-fallbacks.
rescore_fallback_days: 3
rescore_fallback_limit: 40

# Reserved minimum slots by source kind when selecting items for the LLM.
# Unused slots flow to other kinds. industry + community share one combined pool.
selection:
  reserved_slots:
    official_competitor: 8
    emerging: 4
    industry_community: 6
